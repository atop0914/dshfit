name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Format
        # The rule lives in the Makefile and nowhere else: a second copy here is
        # a second definition of "formatted", and the two drift.
        run: make fmt-check
      - name: Vet
        run: go vet ./...
      - name: Test (no skips)
        run: make test-noskip
      - name: Race
        run: go test -count=1 -race ./...
      - name: Zero dependencies
        run: make deps-check
      - name: Cross-compile
        run: make build-check
      - name: Binary smoke
        # The tool must work as a binary, not only as a package: exit codes and
        # text output are part of the contract.
        run: |
          make build
          ./bin/dshfit version
          mkdir -p /tmp/p/ok && cd /tmp/p/ok
          cat > package.json <<'JSON'
          {"name":"dsh-plugin-ok","version":"1.0.0","files":["cordis.patch.yml"],
           "peerDependencies":{"@deepseek-ai/dsh-app-boot":"^0.1.0-rc.6"},
           "dsh":{"bundle":{"patch":"cordis.patch.yml"}}}
          JSON
          printf -- '- insert:\n    - id: dsh-plugin-ok\n      name: dsh-plugin-ok\n' > cordis.patch.yml
          cd - >/dev/null
          set +e
          ./bin/dshfit check --host 0.2.0-rc.2 /tmp/p/ok
          code=$?
          set -e
          test "$code" -eq 1

      - name: README rehearsal
        # Every command the README shows, run against the fixtures with its exit
        # code as the assertion. A document whose commands are not executed is a
        # document that drifts; this step is what makes "the README is accurate"
        # a checkable claim rather than a promise. It dials nothing — the
        # registry section is exercised through --offline and a seeded cache.
        run: sh scripts/readme-rehearsal.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  # The panel answers "will this drop when I upgrade". This job answers the other
  # question: "did someone change a range and nobody noticed". A compatibility
  # regression caught here never reaches a user's machine, which is the only way
  # this tool scales past the people who remember to run it.
  profile-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Build
        run: make build
      - name: Fixture matrix
        # Writes the markdown to $GITHUB_STEP_SUMMARY, never to a PR comment: on a
        # fork PR GITHUB_TOKEN is read-only and a comment would 403, which reads
        # as "the tool is broken" rather than "you are not allowed to comment".
        #
        # This step fails on exit 2 (usage error), on a crash, or on a count that
        # contradicts the table in the script. It does not fail because a plugin
        # is blocked: for these fixtures that is the expected answer, and a gate
        # that is red on every run is a gate nobody reads.
        run: sh scripts/ci-profile-matrix.sh
